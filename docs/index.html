<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#74c26f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Game học Toán lớp 1: bé cùng các bạn thú giải toán để giải cứu muông thú.">
<title>Bé Cứu Muông Thú</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one phone-sized column over a storybook forest — sky on top, grass below; wooden signboards hold the math. Single bright look in every theme. */
:root {
  --sky: #b8e3f5;
  --sky-hi: #e6f6fc;
  --grass: #74c26f;
  --grass-dk: #3f9450;
  --wood: #7a4b23;
  --wood-lt: #b07a45;
  --sun: #ffc83d;
  --sun-dk: #e0a514;
  --paper: #fffdf4;
  --ink: #22314a;
  --muted: #6c7a90;
  --berry: #e2456b;
  --ok: #2fa35a;
  --dot-a: #ff9f1c;
  --dot-b: #3a86ff;
  --font-display: "Baloo 2", "Nunito", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: linear-gradient(var(--sky-hi), var(--sky) 58%, var(--grass) 58%, var(--grass-dk));
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--dot-b); outline-offset: 2px; }

#app {
  max-width: 520px; margin: 0 auto; height: 100%;
  display: flex; flex-direction: column;
  padding-inline: 16px; box-sizing: border-box;
  overflow-y: auto;
}
.screen { display: flex; flex-direction: column; gap: 14px; padding-block: 14px 24px; min-height: 100%; box-sizing: border-box; }

h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.1; text-wrap: balance; }

/* chunky toy buttons */
.btn {
  border: 0; border-radius: 18px; padding: 12px 20px;
  background: var(--sun); color: var(--ink);
  font-family: var(--font-display); font-weight: 800; font-size: 22px;
  box-shadow: 0 5px 0 var(--sun-dk); transition: transform .08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--sun-dk); }
.btn.green { background: var(--grass); color: #fff; box-shadow: 0 5px 0 var(--grass-dk); }
.btn.wood { background: var(--wood-lt); color: #fff; box-shadow: 0 5px 0 var(--wood); }
.btn.ghost { background: var(--paper); box-shadow: 0 5px 0 #d9d2bd; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.big { font-size: 28px; padding: 16px 24px; }
.icon-btn {
  border: 0; background: var(--paper); border-radius: 14px; min-width: 48px; height: 48px;
  font-size: 22px; box-shadow: 0 4px 0 #d9d2bd; padding: 0 12px; font-weight: 800;
}

.sign {
  background: var(--paper); border: 4px solid var(--wood); border-radius: 22px;
  padding: 16px; box-shadow: 0 6px 0 var(--wood);
}

/* ---------- title ---------- */
.title-screen { justify-content: center; align-items: center; text-align: center; gap: 22px; }
.logo { font-size: 50px; color: var(--wood); text-shadow: 0 3px 0 var(--paper), 0 6px 0 rgba(0,0,0,.08); }
.logo small { display: block; font-size: 22px; color: var(--grass-dk); letter-spacing: .04em; }
.parade { font-size: 46px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.parade span { animation: bob 2.4s ease-in-out infinite; display: inline-block; }
.parade span:nth-child(2n) { animation-delay: .4s; }
.parade span:nth-child(3n) { animation-delay: .8s; }
.title-actions { display: flex; flex-direction: column; gap: 14px; width: min(100%, 320px); }

/* ---------- choose hero ---------- */
.heroes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.hero-card {
  border: 4px solid transparent; background: var(--paper); border-radius: 22px; padding: 18px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  box-shadow: 0 5px 0 #d9d2bd; font-family: var(--font-display); font-size: 22px; font-weight: 800;
}
.hero-card .em { font-size: 72px; line-height: 1; }
.hero-card.on { border-color: var(--grass-dk); background: #effae9; }
.field label { display: block; font-weight: 800; margin-bottom: 6px; }
.field input {
  width: 100%; box-sizing: border-box; font: inherit; font-size: 22px; padding: 12px 14px;
  border-radius: 14px; border: 3px solid var(--wood-lt); background: #fff; color: var(--ink);
}

/* ---------- top bar ---------- */
.bar { display: flex; align-items: center; gap: 10px; }
.bar .grow { flex: 1; min-width: 0; }
.bar h2 { font-size: 24px; color: var(--wood); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hearts { font-size: 20px; letter-spacing: -2px; white-space: nowrap; }

/* ---------- map ---------- */
.who { display: flex; align-items: center; gap: 10px; }
.who .em { font-size: 40px; }
.who b { font-family: var(--font-display); font-size: 24px; color: var(--wood); display: block; line-height: 1; }
.who small { color: var(--muted); font-weight: 800; }
.path { position: relative; display: flex; flex-direction: column; gap: 18px; padding-block: 8px; }
.path::before {
  content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 6px dashed var(--wood-lt); opacity: .55;
}
.node {
  position: relative; width: 86%; border: 4px solid var(--wood); border-radius: 22px; background: var(--paper);
  display: flex; flex-direction: column; align-items: stretch; gap: 4px; padding: 10px 12px 8px; text-align: left;
  box-shadow: 0 5px 0 var(--wood); box-sizing: border-box;
}
.node.left { align-self: flex-start; }
.node.right { align-self: flex-end; }
.node:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--wood); }
.node.locked { filter: grayscale(1); opacity: .6; }
.node.boss { border-color: var(--berry); box-shadow: 0 5px 0 #a82a4a; background: #fff5f5; }
.node.current { border-color: var(--grass-dk); box-shadow: 0 5px 0 var(--grass-dk); animation: pulse 1.6s ease-in-out infinite; }
.node-head { display: flex; align-items: center; gap: 8px; }
.node-head b { flex: 1; min-width: 0; font-family: var(--font-display); font-size: 21px; line-height: 1.1; }
.num {
  flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--wood); color: #fff;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums;
}
.boss .num { background: var(--berry); }
.tag { background: var(--berry); color: #fff; font-size: 12px; font-weight: 800; border-radius: 8px; padding: 1px 8px; letter-spacing: .08em; }
.node-scene { display: flex; align-items: center; justify-content: space-around; gap: 10px; padding-top: 4px; }
.foe-wrap { position: relative; display: inline-block; }
.foe { font-size: 56px; line-height: 1; display: inline-block; }
.boss .foe { font-size: 66px; }
.node-cap { text-align: center; color: var(--muted); font-weight: 800; }
.region {
  position: relative; z-index: 1; align-self: center; text-align: center;
  background: var(--wood); color: #fff; border-radius: 16px; padding: 6px 20px; box-shadow: 0 4px 0 #5a3618;
}
.region small { display: block; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; font-weight: 800; }
.region b { font-family: var(--font-display); font-size: 22px; }

/* element badge */
.el-badge {
  position: absolute; right: -8px; bottom: -4px; z-index: 3; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font-size: 16px; line-height: 1;
  background: var(--paper); border: 2px solid var(--wood-lt);
}

/* cage: big captive animal behind iron bars */
.cage-box { position: relative; width: 108px; height: 104px; display: grid; place-items: center; margin-top: 10px; flex: none; }
.cage-box::before {
  content: ""; position: absolute; top: -12px; left: 50%; width: 18px; height: 14px; transform: translateX(-50%);
  border: 4px solid #59606e; border-bottom: 0; border-radius: 12px 12px 0 0; box-sizing: border-box;
}
.captive { font-size: 68px; line-height: 1; display: inline-block; filter: saturate(.75); animation: shiver 2.2s ease-in-out infinite; }
.bars {
  position: absolute; inset: 0; box-sizing: border-box; z-index: 2;
  border: 4px solid #59606e; border-bottom: 12px solid var(--wood); border-radius: 50px 50px 8px 8px / 34px 34px 8px 8px;
  background: repeating-linear-gradient(90deg, transparent 0 13px, rgba(89,96,110,.95) 13px 17px);
  transition: transform .7s cubic-bezier(.5, -0.4, .6, 1.4), opacity .7s;
}
.lock { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); font-size: 26px; z-index: 3; line-height: 1; }
.cage-box .el-badge { top: 4px; right: -6px; bottom: auto; }
.cage-box.open::before { opacity: 0; transition: opacity .4s; }
.cage-box.open .bars { transform: translateY(-120%) rotate(-8deg); opacity: 0; }
.cage-box.open .captive { filter: none; animation: bob 1.6s ease-in-out infinite; }
.cage-box.sm { width: 70px; height: 68px; margin-top: 8px; }
.cage-box.sm .captive { font-size: 42px; }
.cage-box.sm .lock { font-size: 18px; }
.cage-box.sm .bars { border-width: 3px; border-bottom-width: 8px; background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(89,96,110,.95) 9px 12px); }
.cage-box.sm .el-badge { width: 22px; height: 22px; font-size: 12px; }
.cage-pop { display: flex; justify-content: center; padding-top: 10px; }
.cage-pop .cage-box { transform: scale(1.35); margin-block: 20px 14px; }
@keyframes shiver { 0%, 70%, 100% { transform: none; } 75% { transform: translateX(-2px) rotate(-3deg); } 85% { transform: translateX(2px) rotate(3deg); } }

/* element legend */
.legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; font-weight: 800; font-size: 15px; }
.legend span { background: #fff; border: 2px solid #ece5cf; border-radius: 12px; padding: 4px 10px; }
.legend i { font-style: normal; color: var(--muted); font-weight: 600; }
.stars { color: var(--sun-dk); font-size: 18px; letter-spacing: 2px; }
.stars i { color: #d9d2bd; font-style: normal; }
.trophy { text-align: center; }
.trophy .em { font-size: 60px; }

/* ---------- battle ---------- */
.arena {
  position: relative; display: grid; grid-template-columns: 1fr 1fr; align-items: end;
  min-height: 170px; padding-bottom: 6px;
}
.side { display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
.me-row { display: flex; align-items: flex-end; gap: 2px; }
.hero-sprite { font-size: 50px; line-height: 1; }
.pet-sprite { font-size: 66px; line-height: 1; display: inline-block; position: relative; z-index: 2; }
.enemy-sprite { font-size: 84px; line-height: 1; display: inline-block; }
.shield-badge { position: absolute; top: -6px; left: 4px; font-size: 30px; }
.hpbar { width: 86%; height: 14px; border-radius: 10px; background: #fff; border: 3px solid var(--wood); overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--berry); transition: width .4s; }
.hp-num { font-weight: 800; font-size: 14px; color: var(--ink); font-variant-numeric: tabular-nums; }
.foe-row { display: flex; align-items: flex-end; gap: 6px; }
.float.strong { font-size: 42px; color: #ff6a00; }
.float.weak { font-size: 26px; color: var(--muted); }
.bubble {
  position: absolute; bottom: 100%; right: 0; max-width: 92%;
  background: #fff; border-radius: 16px; padding: 6px 10px; font-weight: 800; font-size: 14px;
  border: 3px solid var(--ink); margin-bottom: 4px;
}
.float {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  font-family: var(--font-display); font-weight: 800; font-size: 34px; color: var(--berry);
  text-shadow: 0 2px 0 #fff; animation: rise 1s ease-out forwards; pointer-events: none; white-space: nowrap; z-index: 5;
}
.float.good { color: var(--ok); }

.panel { display: flex; flex-direction: column; gap: 12px; }
.q { display: flex; align-items: center; gap: 10px; }
.q-body { flex: 1; text-align: center; min-width: 0; }
.eq { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: 1.1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.eq .blank { display: inline-block; min-width: 1.1em; border-bottom: 5px solid var(--sun-dk); color: var(--sun-dk); }
.ask { font-weight: 800; font-size: 18px; color: var(--muted); }
.things { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 6px; font-size: 32px; line-height: 1.15; }
.thing { display: inline-flex; flex-direction: column; align-items: center; }
.thing b { font-size: 15px; color: var(--dot-b); font-family: var(--font-display); }
.speak { flex: none; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choices.three { grid-template-columns: repeat(3, 1fr); }
.choice {
  border: 0; border-radius: 20px; min-height: 76px; background: var(--sun);
  box-shadow: 0 6px 0 var(--sun-dk); font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.choice small { font-family: var(--font-body); font-size: 14px; }
.choice:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-dk); }
.choice.right { background: var(--ok); color: #fff; box-shadow: 0 6px 0 #1f7a41; }
.choice.wrong { background: var(--berry); color: #fff; box-shadow: 0 6px 0 #a82a4a; }

.hint { display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
.hint-title { font-family: var(--font-display); font-size: 26px; font-weight: 800; }
.hint-title b { color: var(--ok); font-size: 34px; }
.dots { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; font-family: var(--font-display); font-size: 28px; font-weight: 800; }
.dot { width: 22px; height: 22px; border-radius: 50%; background: var(--dot-a); display: inline-block; }
.dot.b { background: var(--dot-b); }
.dot.gone { background: transparent; border: 3px dashed var(--muted); box-sizing: border-box; position: relative; }
.dot-group { display: inline-flex; flex-wrap: wrap; gap: 4px; max-width: 150px; justify-content: center; }
.why { font-weight: 800; color: var(--muted); }

.tray {
  display: flex; gap: 10px; overflow-x: auto; padding: 6px 16px 12px; margin-inline: -16px; cursor: grab;
  scrollbar-width: none; overscroll-behavior-x: contain;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 18px, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(90deg, transparent, #000 18px, #000 calc(100% - 28px), transparent);
}
.tray::-webkit-scrollbar { display: none; }
.tray.grabbing { cursor: grabbing; }
.tray.grabbing .pet-card { pointer-events: none; }
.tray .pet-card { flex: 0 0 92px; position: relative; transition: transform .15s; }
.tray .pet-card.on { transform: translateY(-4px); }
.pet-card .el-badge { top: 3px; right: 3px; bottom: auto; width: 22px; height: 22px; font-size: 12px; }
.mu { font-size: 11px; font-weight: 800; border-radius: 8px; padding: 1px 6px; margin-top: 2px; white-space: nowrap; }
.mu.strong { background: var(--ok); color: #fff; }
.mu.normal { background: #ece5cf; color: var(--ink); }
.mu.weak { background: var(--berry); color: #fff; }
.locked-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px; margin-top: 10px; }
.locked-grid span { font-size: 36px; text-align: center; filter: brightness(0); opacity: .22; }

/* new problem types */
.shapes { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; }
.shapes .dim { opacity: .18; }
.seq { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.seq b {
  font-family: var(--font-display); font-size: 32px; min-width: 56px; padding: 2px 6px; box-sizing: border-box; text-align: center;
  border-radius: 12px; background: #fff; border: 3px solid var(--wood-lt); font-variant-numeric: tabular-nums;
}
.seq b.blank { color: var(--sun-dk); border-style: dashed; border-color: var(--sun-dk); }
.seq b.hit { background: var(--ok); color: #fff; border-color: var(--ok); }
.blocks { display: flex; align-items: flex-end; justify-content: center; gap: 4px; flex-wrap: wrap; margin-bottom: 6px; }
.rod { width: 12px; height: 62px; box-sizing: border-box; border: 2px solid var(--ink); border-radius: 3px; background: repeating-linear-gradient(var(--dot-b) 0 4.6px, #fff 4.6px 5.8px); }
.cubes { display: inline-flex; flex-wrap: wrap-reverse; width: 44px; gap: 2px; margin-left: 8px; }
.cube { width: 12px; height: 12px; box-sizing: border-box; border: 2px solid var(--ink); background: var(--dot-a); border-radius: 2px; }
.choice.txt { font-size: 21px; padding: 6px; }

.pet-card {
  border: 3px solid var(--wood-lt); border-radius: 16px; background: var(--paper); padding: 6px 4px;
  display: flex; flex-direction: column; align-items: center; gap: 0; box-shadow: 0 4px 0 var(--wood-lt);
}
.pet-card .em { font-size: 32px; line-height: 1.1; }
.pet-card b { font-size: 13px; line-height: 1.1; }
.pet-card small { font-size: 12px; color: var(--muted); font-weight: 800; }
.pet-card .en { font-size: 12px; letter-spacing: -1px; }
.pet-card.on { border-color: var(--grass-dk); background: #effae9; box-shadow: 0 4px 0 var(--grass-dk); }
.pet-card.hungry { filter: grayscale(1); opacity: .55; }
.tray-label { font-weight: 800; font-size: 14px; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.35); }

/* ---------- camp ---------- */
.camp-list { display: flex; flex-direction: column; gap: 12px; }
.camp-card { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; }
.camp-card .em { font-size: 58px; line-height: 1; grid-row: span 2; }
.camp-card h3 { font-size: 22px; }
.camp-card .meta { font-size: 14px; color: var(--muted); font-weight: 800; }
.camp-card .row { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.xp { height: 10px; background: #ece5cf; border-radius: 8px; overflow: hidden; margin-top: 4px; }
.xp i { display: block; height: 100%; background: var(--dot-b); }
.camp-card.locked { filter: grayscale(1); opacity: .55; }
.energy { font-size: 18px; letter-spacing: -1px; }
.feed-stage { display: flex; align-items: flex-end; justify-content: center; gap: 28px; position: relative; padding-top: 8px; }
.feed-pet { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.feed-pet .em { font-size: 104px; line-height: 1; }
.mood { font-weight: 800; font-size: 16px; background: var(--paper); border-radius: 12px; padding: 2px 10px; }
.qcount { font-family: var(--font-display); font-weight: 800; font-size: 18px; background: var(--paper); border-radius: 12px; padding: 4px 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }

/* hungry pets look shrunken: thinner, smaller, paler, drooping */
.pet-body {
  display: inline-block; transform-origin: 50% 100%;
  transform: scale(var(--sx, 1), var(--sy, 1)) rotate(var(--tilt, 0deg));
  filter: saturate(var(--sat, 1)) brightness(var(--bri, 1));
  transition: transform .6s cubic-bezier(.3, 1.5, .5, 1), filter .6s;
}
.pet-body.droopy { animation: droop 2.6s ease-in-out infinite; }
.pet-body.yum { animation: yum .5s; }
@keyframes droop { 50% { transform: scale(var(--sx, 1), calc(var(--sy, 1) * .94)) rotate(calc(var(--tilt, 0deg) - 4deg)); } }

/* attack gauge: 10 segments light up from the bottom */
.gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.gauge-top { font-size: 26px; line-height: 1; }
.gauge {
  display: flex; flex-direction: column-reverse; gap: 3px; width: 54px; height: 190px; padding: 5px; box-sizing: border-box;
  border: 4px solid var(--wood); border-radius: 16px; background: var(--paper);
}
.seg { flex: 1; border-radius: 5px; background: #ece5cf; transition: background .3s, transform .3s; }
.seg.on { background: linear-gradient(90deg, var(--sun), var(--sun-dk)); }
.seg.on:last-of-type { background: linear-gradient(90deg, #ffd86b, var(--sun-dk)); }
.jar-pct { font-family: var(--font-display); font-weight: 800; font-size: 24px; color: var(--wood); background: var(--paper); border-radius: 12px; padding: 0 10px; font-variant-numeric: tabular-nums; }
.gauge-cap { font-size: 12px; font-weight: 800; color: var(--ink); background: var(--paper); border-radius: 8px; padding: 0 6px; }
.gauge-wrap.bump .gauge { animation: hit .45s; }
.fullbar { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; }
.fullbar .mini { width: 70px; height: 10px; border-radius: 8px; background: #ece5cf; overflow: hidden; border: 2px solid var(--wood-lt); }

      p.html = `<div class="eq">${a} − ${b} = <span class="blank">?</span></div>`;
      p.speech = `${a} trừ ${b} bằng mấy?`;
      p.hint = `<div class="dots">${dots(d)}${b ? dots(b, "gone") : ""}</div><div class="why">Có ${a}, bớt đi ${b}, còn lại ${d}.</div>`;
      p.explain = `${a} trừ ${b} bằng ${d}.`;
      p.choices = numChoices(d, [1, 2, -1, -2]);
    } else if (type === "sosanh") {
      const R = lvl === 1 ? 10 : lvl === 2 ? 20 : 100;
      const a = rand(0, R); let b = a;
      if (Math.random() > 0.2) while (b === a) b = rand(0, R);
      const sym = a > b ? ">" : a < b ? "<" : "=";
      const word = { ">": "lớn hơn", "<": "bé hơn", "=": "bằng" };
      p.answer = sym;
      p.html = `<div class="eq">${a} <span class="blank">?</span> ${b}</div><div class="ask">Chọn dấu đúng</div>`;
      p.speech = `So sánh ${a} và ${b}.`;
      p.hint = `<div class="eq">${a} ${sym} ${b}</div><div class="why">${a} ${word[sym]} ${b}</div>`;
      p.explain = `${a} ${word[sym]} ${b}.`;
      p.choices = [">", "<", "="].map(v => ({ v, label: v, sub: word[v] }));
      p.three = true;
    } else if (type === "hinh") { // nhận biết hình
      const names = { tron: "hình tròn", vuong: "hình vuông", tamgiac: "hình tam giác", chunhat: "hình chữ nhật" };
      const kinds = Object.keys(names);
      if (lvl === 1) {
        const k = pick(kinds);
        p.answer = k;
        p.html = `<div class="shapes">${shape(k, pick(SHAPE_COLORS), 96)}</div><div class="ask">Đây là hình gì?</div>`;
        p.speech = "Đây là hình gì?";
        p.hint = `<div class="shapes">${shape(k, SHAPE_COLORS[0], 80)}</div>`;
        p.explain = `Đây là ${names[k]}.`;
        p.choices = shuffle(kinds.slice()).map(v => ({ v, label: names[v].replace("hình ", "Hình ") }));
        p.txt = true;
      } else {
        const k = pick(kinds), n = rand(1, lvl === 2 ? 4 : 6), others = rand(2, 4);
        const list = shuffle([...Array(n).fill(k), ...Array.from({ length: others }, () => pick(kinds.filter(x => x !== k)))]);
        const draw = dim => list.map(x => `<span class="${dim && x !== k ? "dim" : ""}">${shape(x, pick(SHAPE_COLORS), 44)}</span>`).join("");
        p.answer = n;
        p.html = `<div class="shapes">${draw(false)}</div><div class="ask">Có bao nhiêu ${names[k]}?</div>`;
        p.speech = `Có bao nhiêu ${names[k]}?`;
        p.hint = `<div class="shapes">${draw(true)}</div>`;
        p.explain = `Có ${n} ${names[k]}.`;
        p.choices = numChoices(n, [1, 2, -1]);
      }
    } else if (type === "dayso") { // số còn thiếu trong dãy
      let start, step;
      if (lvl === 1) { start = rand(0, 6); step = 1; }
      else if (lvl === 2) { step = pick([1, -1]); start = step > 0 ? rand(5, 16) : rand(8, 20); }
      else if (Math.random() < 0.5) { step = 10; start = rand(1, 6) * 10; }
      else { step = 2; start = rand(0, 12) * 2; }
      const seq = [0, 1, 2, 3].map(i => start + i * step), miss = rand(0, 3);
      p.answer = seq[miss];
      p.html = `<div class="seq">${seq.map((v, i) => i === miss ? `<b class="blank">?</b>` : `<b>${v}</b>`).join("")}</div><div class="ask">Số nào còn thiếu?</div>`;
      p.speech = "Số nào còn thiếu?";
      const rule = step === 1 ? "Mỗi số hơn số trước 1." : step === -1 ? "Mỗi số kém số trước 1." : `Mỗi số hơn số trước ${step}.`;
      p.hint = `<div class="seq">${seq.map((v, i) => `<b class="${i === miss ? "hit" : ""}">${v}</b>`).join("")}</div><div class="why">${rule}</div>`;
      p.explain = `Số còn thiếu là ${seq[miss]}. ${rule}`;
      p.choices = numChoices(seq[miss], step >= 10 ? [10, -10, 1] : [1, -1, 2, -2]);
    } else if (type === "chuc") { // chục và đơn vị
      const n = rand(10, lvl === 1 ? 50 : 99), t = Math.floor(n / 10), u = n % 10;
      const blocks = `<div class="blocks">${Array(t).fill(`<i class="rod"></i>`).join("")}<span class="cubes">${Array(u).fill(`<i class="cube"></i>`).join("")}</span></div>`;
      if (Math.random() < 0.5) {
        p.answer = n;
        p.html = `${blocks}<div class="ask">${t} chục và ${u} đơn vị là số nào?</div>`;
        p.speech = `${t} chục và ${u} đơn vị là số nào?`;
        p.choices = numChoices(n, [1, -1, 10, -10]);
        if (u > 0 && u * 10 + t !== n && !p.choices.some(c => c.v === u * 10 + t)) p.choices[p.choices.findIndex(c => c.v !== n)] = { v: u * 10 + t, label: String(u * 10 + t) };
      } else {
        p.answer = t;
        p.html = `<div class="eq">${n}</div><div class="ask">Số ${n} có mấy chục?</div>`;
        p.speech = `Số ${n} có mấy chục?`;
        p.choices = numChoices(t, [1, -1, 2]);
        if (u > 0 && u !== t && !p.choices.some(c => c.v === u)) p.choices[p.choices.findIndex(c => c.v !== t)] = { v: u, label: String(u) };
      }
      p.hint = `${blocks}<div class="why">Số ${n} gồm ${t} chục và ${u} đơn vị.</div>`;
      p.explain = `Số ${n} gồm ${t} chục và ${u} đơn vị.`;
    } else { // tram: cộng trừ trong phạm vi 100 không nhớ
      const add = Math.random() < 0.5; let a, b;
      if (lvl === 1) {
        if (add) { a = rand(1, 8) * 10; b = rand(1, 10 - a / 10) * 10; }
        else { a = rand(2, 9) * 10; b = rand(1, a / 10 - 1) * 10; }
      } else if (lvl === 2) {
        const t = rand(1, 9);
        if (add) { const u = rand(0, 8); a = t * 10 + u; b = rand(1, 9 - u); }
        else { const u = rand(1, 9); a = t * 10 + u; b = rand(1, u); }
      } else {
        const t1 = add ? rand(1, 8) : rand(2, 9), u1 = rand(add ? 0 : 1, add ? 8 : 9);
        a = t1 * 10 + u1;
        b = add ? rand(1, 9 - t1) * 10 + rand(0, 9 - u1) : rand(1, t1 - 1) * 10 + rand(0, u1);
      }
      const r = add ? a + b : a - b, op = add ? "+" : "−", opw = add ? "cộng" : "trừ";
      p.answer = r;
      p.html = `<div class="eq">${a} ${op} ${b} = <span class="blank">?</span></div>`;
      p.speech = `${a} ${opw} ${b} bằng mấy?`;
      const tensOnly = a % 10 === 0 && b % 10 === 0;
      p.hint = `<div class="eq">${a} ${op} ${b} = ${r}</div>` +
        (tensOnly ? `<div class="why">${a / 10} chục ${opw} ${b / 10} chục = ${r / 10} chục</div>` : `<div class="why">Tính hàng đơn vị trước, rồi đến hàng chục.</div>`);
      p.explain = `${a} ${opw} ${b} bằng ${r}.`;
      p.choices = numChoices(r, [1, -1, 10, -10, 2]);
    }
    return p;
  }

  function problemHTML(p) {
    return `<div class="sign q"><div class="q-body">${p.html}</div><button class="icon-btn speak" data-speak aria-label="Đọc to">🔊</button></div>
      <div class="choices${p.three ? " three" : ""}">${p.choices.map((c, i) =>
        `<button class="choice${p.txt ? " txt" : ""}" data-c="${i}">${c.label}${c.sub ? `<small>${c.sub}</small>` : ""}</button>`).join("")}</div>`;
  }
  function bindProblem(panel, p, onAnswer) {
    $("[data-speak]", panel).onclick = () => say(p.speech, false, true);
    panel.querySelectorAll("[data-c]").forEach(btn => {
      btn.onclick = () => onAnswer(btn, p.choices[+btn.dataset.c]);
    });
  }
  function markChoices(panel, btn, ok, p) {
    btn.classList.add(ok ? "right" : "wrong");
    if (!ok) panel.querySelectorAll("[data-c]").forEach(b => { if (p.choices[+b.dataset.c].v === p.answer) b.classList.add("right"); });
  }
  function hintHTML(p, shieldMsg) {
    const right = p.choices.find(c => c.v === p.answer).label;
    return `<div class="sign hint"><div class="hint-title">Đáp án đúng là <b>${right}</b></div>${p.hint}
      ${shieldMsg ? `<div class="why">${shieldMsg}</div>` : ""}
      <button class="btn green big" data-next>Tiếp tục ▶</button></div>`;
  }
  function record(type, ok) { S.stats[type][1]++; if (ok) S.stats[type][0]++; }

  /* ================= SCREENS ================= */
  function go(name, arg) { clearInterval(ticker); window.onresize = window.onkeydown = null; hideModal(); try { speechSynthesis.cancel(); } catch (e) {} app.scrollTop = 0; SCREENS[name](arg); }

  const SCREENS = {
    title() {
      app.innerHTML = `<div class="screen title-screen">
        <h1 class="logo">Bé Cứu Muông Thú<small>Học Toán lớp 1</small></h1>
        <div class="parade" aria-hidden="true"><span>🐶</span><span>🐝</span><span>🐢</span><span>🦉</span><span>🐘</span></div>
        <div class="title-actions">
          <button class="btn big green" data-go>${S.hero ? "Chơi tiếp ▶" : "Bắt đầu ▶"}</button>
          <button class="btn ghost" data-parent>👪 Góc phụ huynh</button>
        </div></div>`;
      $("[data-go]").onclick = () => { sfx("ok"); go(S.hero ? "map" : "choose"); };
      $("[data-parent]").onclick = () => go("parent");
    },

    choose() {
      let pickHero = S.hero || "boy";
      app.innerHTML = `<div class="screen">
        <div class="bar"><button class="icon-btn" data-back aria-label="Quay lại">←</button><div class="grow"><h2>Chọn nhân vật</h2></div></div>
        <div class="heroes">
          <button class="hero-card" data-h="boy"><span class="em">👦</span>Bé trai</button>
          <button class="hero-card" data-h="girl"><span class="em">👧</span>Bé gái</button>
        </div>
        <div class="sign field"><label for="heroName">Tên của bé</label><input id="heroName" maxlength="14" placeholder="Ví dụ: Bin" value="${S.name.replace(/"/g, "&quot;")}"></div>
        <button class="btn big green" data-start>Lên đường! 🌳</button></div>`;
      const mark = () => app.querySelectorAll("[data-h]").forEach(b => b.classList.toggle("on", b.dataset.h === pickHero));
      mark();
      app.querySelectorAll("[data-h]").forEach(b => b.onclick = () => { pickHero = b.dataset.h; mark(); sfx("ok"); });
      $("[data-back]").onclick = () => go("title");
      $("[data-start]").onclick = () => {
        S.hero = pickHero; S.name = $("#heroName").value.trim(); persist();
        say(`Chào ${heroName()}! Cùng đi giải cứu các bạn thú nhé!`);
        go("map");
      };
    },

    map() {
      const L = mapLayout();
      const { W, H, pts } = L;
      const cur = S.done ? STAGES.length - 1 : S.unlocked;
      let html = "";
      // biển tên vùng
      REGIONS.forEach((name, r) => {
        const sg = L.signs[r];
        html += `<div class="msign" style="left:${sg.x}px;top:${sg.y}px"><small>Vùng ${r + 1}</small>${name}</div>`;
      });
      // cây cỏ, đá, hoa trang trí
      html += L.deco.map(d => `<span class="deco" style="left:${d.x}px;top:${d.y}px;font-size:${d.s}px">${d.e}</span>`).join("");
      // muông thú tự do: vịt bơi, cá nhảy, bướm bay
      html += L.ambient.map(d => `<span class="amb ${d.cls}" style="left:${d.x}px;top:${d.y}px;animation-delay:${d.delay}s">${d.e}</span>`).join("");
      // các màn
      STAGES.forEach((st, i) => {
        const p = pts[i], locked = i > S.unlocked, cleared = S.stars[i] > 0, freed = S.owned.includes(st.rescue);
        const stars = "★".repeat(S.stars[i]) + `<i>${"★".repeat(3 - S.stars[i])}</i>`;
        html += `<button class="mnode${locked ? " locked" : ""}${cleared ? " cleared" : ""}${i === cur && !S.done ? " current" : ""}${st.boss ? " boss" : ""}"
            data-i="${i}" style="left:${p.x}px;top:${p.y}px" aria-label="Màn ${i + 1}: ${st.enemy}">
          <span class="mn-foe">${cleared ? "🏳️" : st.emoji}</span>${cleared ? "" : elBadge(st.el)}
          <span class="mn-num">${i + 1}</span><span class="mn-stars">${stars}</span></button>`;
        const c = L.cages[i];
        html += freed
          ? `<span class="wander" style="left:${p.x}px;top:${p.y}px;animation-duration:${10 + (i % 4) * 1.6}s;animation-delay:-${(i * 2.3).toFixed(1)}s"><span class="roam-in" style="animation-delay:-${(i * .17).toFixed(2)}s">${ANIMALS[st.rescue].emoji}</span></span>`
          : `<div class="mcage${locked ? " locked" : ""}" data-i="${i}" style="left:${c.x}px;top:${c.y}px">${cageHTML(st.rescue, false)}</div>`;
      });
      const hp = pts[cur];
      html += `<div class="hero-mark" style="left:${hp.x}px;top:${hp.y - 62}px">${heroEmoji()}<span>🐶</span></div>`;
      if (S.done) html += `<div class="deco trophy-mark" style="left:${pts[19].x}px;top:${pts[19].y - 70}px">🏆</div>`;

      app.innerHTML = `<div class="map-view" id="mapView">
          <div class="world" id="world" style="width:${W}px;height:${H}px">${L.svg}${html}</div>
        </div>
        <div class="map-hud">
          <div class="who sign-pill"><span class="em">${heroEmoji()}</span><div><b>${heroName()}</b><small>Đã cứu ${S.owned.length - 1}/${ORDER.length - 1} bạn thú</small></div></div>
          <span class="grow"></span>
          <button class="icon-btn" data-legend aria-label="Bảng khắc chế">☯️</button>
          <button class="icon-btn" data-camp aria-label="Trại thú">🏕️<span class="lbl"> Trại</span></button>
          <button class="icon-btn" data-home aria-label="Màn hình chính">🏠</button>
        </div>
        <button class="icon-btn map-focus" data-focus aria-label="Về màn đang chơi">📍</button>
        <div class="map-tip" id="mapTip">👆 Kéo để xem cả khu vườn</div>`;

      const view = $("#mapView"), world = $("#world");
      const pan = enablePan(view, world, W, H);
      pan.focus(hp.x, hp.y);
      setTimeout(() => { const t = $("#mapTip"); if (t) t.classList.add("gone"); }, 2600);

      const open = i => { if (pan.wasDrag()) return; stageCard(i); };
      app.querySelectorAll(".mnode, .mcage").forEach(b => b.addEventListener("click", () => open(+b.dataset.i)));
      $("[data-legend]").onclick = showLegend;
      $("[data-camp]").onclick = () => go("camp");
      $("[data-home]").onclick = () => go("title");
      $("[data-focus]").onclick = () => pan.focus(hp.x, hp.y, true);
    },

    camp() {
      const cards = ORDER.map(id => {
        const a = ANIMALS[id];
        if (!S.owned.includes(id)) return "";
        const ps = S.pets[id], lv = level(id), pct = lv >= 3 ? 100 : ((ps.xp % 8) / 8) * 100;
        const en = `<span class="fullbar">⚔️ <span class="mini"><i style="width:${fullPct(id)}%"></i></span>${S.pets[id].atk}/${ATK_MAX} lượt</span>`;
        return `<div class="sign camp-card"><span class="em"><span class="pet-body${isHungry(id) ? " droopy" : ""}" style="${bodyStyle(id)}">${a.emoji}</span></span>
          <div><h3>${a.name} · Cấp ${lv}</h3><div class="xp"><i style="width:${pct}%"></i></div></div>
          <div class="meta">${a.el ? `Hệ ${ELEM[a.el].icon} ${ELEM[a.el].name}` : "Không hệ"} · ${TOPIC[a.type]} · Đòn: ${a.move.name} · ${a.skill}: ${a.desc}</div>
          <div class="row"><span class="energy">${en}</span>
            <button class="btn wood" data-feed="${id}"></button></div></div>`;
      }).join("");
      app.innerHTML = `<div class="screen">
        <div class="bar"><button class="icon-btn" data-back aria-label="Về bản đồ">←</button><div class="grow"><h2>🏕️ Trại thú</h2></div></div>
        <p class="note" style="color:var(--ink)">Mỗi câu đúng khi cho ăn = thêm 1 lượt tấn công ⚔️. Đúng cả ${FEED_QUESTIONS} câu = ${ATK_MAX} lượt. Mỗi lần ra đòn trong trận tốn 1 lượt. Cho ăn xong phải đợi 5 phút mới được cho ăn tiếp.</p>
        <div class="camp-list">${cards}</div>
        ${S.owned.length < ORDER.length ? `<div class="sign"><h3>Bạn thú đang chờ giải cứu</h3>
          <div class="locked-grid">${ORDER.filter(id => !S.owned.includes(id)).map(id => `<span>${ANIMALS[id].emoji}</span>`).join("")}</div></div>` : ""}</div>`;
      $("[data-back]").onclick = () => go("map");
      const btns = app.querySelectorAll("[data-feed]");
      const refresh = () => btns.forEach(b => {
        const id = b.dataset.feed, a = ANIMALS[id], wait = feedWait(id);
        if (S.pets[id].atk >= ATK_MAX) { b.textContent = "No rồi 😋"; b.disabled = true; }
        else if (wait > 0) { b.textContent = `⏳ Chờ ${mmss(wait)}`; b.disabled = true; }
        else { b.textContent = `Cho ăn ${a.food}`; b.disabled = false; }
      });
      refresh();
      ticker = setInterval(refresh, 1000);
      btns.forEach(b => b.onclick = () => go("feed", b.dataset.feed));
    },

    feed(id) {
      const a = ANIMALS[id], ps = S.pets[id];
      app.innerHTML = `<div class="screen">
        <div class="bar"><button class="icon-btn" data-back aria-label="Về trại">←</button><div class="grow"><h2>${a.name}</h2></div><div class="qcount" id="qCount"></div></div>
        <div class="feed-stage">
          <div class="feed-pet"><span class="em pet-body" id="feedPet">${a.emoji}</span><div class="mood" id="mood"></div></div>
          <div class="gauge-wrap" id="jar" aria-label="Lượt tấn công">
            <div class="gauge-top">⚔️</div>
            <div class="gauge">${Array.from({ length: ATK_MAX }, () => `<i class="seg"></i>`).join("")}</div>
            <div class="jar-pct" id="jarPct"></div><div class="gauge-cap">lượt tấn công</div></div>
        </div>
        <div class="panel" id="panel"></div></div>`;
      $("[data-back]").onclick = () => go("camp");
      const panel = $("#panel"), petEl = $("#feedPet");
      let asked = 0, right = 0, busy = false;
      const draw = () => {
        $("#qCount").textContent = `Câu ${Math.max(asked, 1)}/${FEED_QUESTIONS}`;
        petEl.setAttribute("style", bodyStyle(id));
        petEl.classList.toggle("droopy", isHungry(id));
        $("#mood").textContent = mood(id);
        app.querySelectorAll(".gauge .seg").forEach((g, i) => g.classList.toggle("on", i < ps.atk));
        $("#jarPct").textContent = `${ps.atk}/${ATK_MAX}`;
      };
      const finish = full => {
        draw();
        const msg = full ? `${a.name} no căng bụng rồi! 😋 Có đủ ${ATK_MAX} lượt tấn công.` : `Hết ${FEED_QUESTIONS} câu rồi. ${a.name} có ${ps.atk} lượt tấn công.`;
        const sub = `<p class="why">Đợi 5 phút nữa mới được cho ăn tiếp nhé.</p>`;
        panel.innerHTML = `<div class="sign hint"><div class="hint-title">${msg}</div><p class="why">Đúng ${right}/${asked} câu</p>${sub}
          <button class="btn green big" data-camp>Về trại</button></div>`;
        $("[data-camp]", panel).onclick = () => go("camp");
        say(msg.replace(/[😋⚔️]/gu, ""));
      };
      const next = () => {
        if (ps.atk >= ATK_MAX) return finish(true);
        if (asked >= FEED_QUESTIONS) return finish(false);
        asked++; draw();
        const p = makeProblem(a.type, diff(id));
        panel.innerHTML = problemHTML(p); busy = false;
        bindProblem(panel, p, (btn, c) => {
          if (busy) return; busy = true;
          if (asked === 1) { ps.fedAt = Date.now(); }   // bắt đầu tính 5 phút chờ từ câu đầu tiên
          const ok = c.v === p.answer, lvBefore = level(id);
          record(p.type, ok); markChoices(panel, btn, ok, p);
          if (ok) {
            right++; sfx("eat"); ps.xp++;
            ps.atk = Math.min(ATK_MAX, ps.atk + 1);
            persist(); draw();
            anim(petEl, "yum"); anim($("#jar"), "bump");
            floatText($(".feed-pet"), a.food + " +1 ⚔️", true);
            say(pick(PRAISE));
            if (level(id) > lvBefore) toast(`${a.name} lên cấp ${level(id)}! Bài sẽ khó hơn một chút.`);
            setTimeout(next, 900);
          } else {
            sfx("bad"); persist();
            setTimeout(() => {
              panel.innerHTML = hintHTML(p); say("Chưa đúng rồi. " + p.explain);
              $("[data-next]", panel).onclick = next;
            }, 600);
          }
        });
        say(p.speech);
      };
      draw();
      const wait = feedWait(id);
      if (wait > 0 || ps.atk >= ATK_MAX) {
