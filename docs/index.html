  /* ================= WORLD MAP ================= */
  // Bản đồ là một bức tranh lớn (vườn xanh, bờ hồ) để kéo thả. Màn 1 ở dưới cùng, đi ngược lên lâu đài.
  function seeded(seed) {
    return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  function smoothPath(p) {
    let d = `M${p[0].x},${p[0].y}`;
    for (let i = 0; i < p.length - 1; i++) {
      const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
      d += ` C${(p1.x + (p2.x - p0.x) / 6).toFixed(1)},${(p1.y + (p2.y - p0.y) / 6).toFixed(1)} ${(p2.x - (p3.x - p1.x) / 6).toFixed(1)},${(p2.y - (p3.y - p1.y) / 6).toFixed(1)} ${p2.x},${p2.y}`;
    }
    return d;
  }
  function mapLayout() {
    const W = 700, H = 3000, step = (H - 340) / (STAGES.length - 1), rnd = seeded(20261004);
    const yOf = i => H - 170 - i * step;
    const lake = { cx: W * 0.27, cy: (yOf(5) + yOf(9)) / 2, rx: W * 0.22, ry: step * 2 + 30 };
    const pts = STAGES.map((st, i) => {
      const x = st.region === 1 ? W * 0.68 + Math.sin(i * 1.3) * W * 0.1 : W / 2 + Math.sin(i * 1.05 + 0.4) * W * 0.27;
      return { x: Math.round(x), y: Math.round(yOf(i)) };
    });
    const cages = pts.map((p, i) => {
      const right = STAGES[i].region === 1 || p.x < W / 2;
      return { x: Math.round(p.x + (right ? 100 : -100)), y: p.y - 6 };
    });
    const signs = REGIONS.map((_, r) => {
      const i = r * 5, y = yOf(i) + step * 0.55, px = (pts[i].x + (pts[i - 1] || pts[i]).x) / 2;
      return { x: Math.round(px < W / 2 ? px + 170 : px - 170), y: Math.round(y) };
    });
    // các điểm trên đường đi, để cây cỏ không mọc đè lên đường
    const samples = [];
    pts.forEach((p, i) => { const q = pts[i + 1]; if (!q) return; for (let k = 0; k < 8; k++) samples.push({ x: p.x + (q.x - p.x) * k / 8, y: p.y + (q.y - p.y) * k / 8 }); });
    const inLake = (x, y, pad) => ((x - lake.cx) / (lake.rx + pad)) ** 2 + ((y - lake.cy) / (lake.ry + pad)) ** 2 < 1;
    const blocked = (x, y) => samples.some(s => Math.hypot(s.x - x, s.y - y) < 62)
      || cages.some(c => Math.hypot(c.x - x, c.y - y) < 85) || pts.some(p => Math.hypot(p.x - x, p.y - y) < 80)
      || signs.some(s => Math.abs(s.x - x) < 90 && Math.abs(s.y - y) < 40);
    const band = r => ({ top: r === 3 ? 0 : yOf(r * 5 + 4) - step / 2, bot: r === 0 ? H : yOf(r * 5) + step / 2 });
    const LAND = [
      ["🌳", "🌳", "🌲", "🌷", "🌼", "🍄", "🌿", "🌻", "🌸", "🌳"],
      ["🌾", "🌸", "🌳", "🌷", "🪻", "🌿", "🌳", "🌼"],
      ["🪨", "🪨", "🌲", "🌲", "🌵", "🌿", "🌲"],
      ["🌲", "🍂", "🕸️", "🍄", "🪨", "🌲", "🌲"]
    ];
    const deco = [];
    LAND.forEach((list, r) => {
      const b = band(r);
      for (let n = 0, tries = 0; n < 46 && tries < 900; tries++) {
        const x = 20 + rnd() * (W - 40), y = b.top + 30 + rnd() * (b.bot - b.top - 40);
        if (blocked(x, y) || inLake(x, y, 24)) continue;
        const e = list[Math.floor(rnd() * list.length)];
        deco.push({ x: Math.round(x), y: Math.round(y), e, s: Math.round((/🌳|🌲|🪨/.test(e) ? 40 : 24) + rnd() * 18) }); n++;
      }
    });
    for (let n = 0; n < 9; n++) { // sen trên hồ
      const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * .78;
      deco.push({ x: Math.round(lake.cx + Math.cos(a) * lake.rx * rr), y: Math.round(lake.cy + Math.sin(a) * lake.ry * rr), e: "🪷", s: 26 });
    }
    deco.push({ x: W / 2, y: 90, e: "🏰", s: 120 });
    deco.sort((a, b) => a.y - b.y);   // vật ở dưới che vật ở trên
    const ambient = [
      { e: "🦆", cls: "swim", x: lake.cx - 50, y: lake.cy - 80, delay: 0 },
      { e: "🦆", cls: "swim", x: lake.cx + 30, y: lake.cy + 60, delay: -2 },
      { e: "🦢", cls: "swim", x: lake.cx - 20, y: lake.cy + 170, delay: -4 },
      { e: "🐟", cls: "leap", x: lake.cx + 60, y: lake.cy - 160, delay: 0 },
      { e: "🐟", cls: "leap", x: lake.cx - 90, y: lake.cy + 80, delay: -1.6 },
      { e: "🦋", cls: "flutter", x: W * 0.2, y: H - 300, delay: 0 },
      { e: "🦋", cls: "flutter", x: W * 0.8, y: H - 620, delay: -1.3 },
      { e: "🐦", cls: "flutter", x: W * 0.15, y: yOf(12), delay: -.6 },
      { e: "🐌", cls: "crawl", x: W * 0.85, y: H - 120, delay: 0 },
      { e: "🦋", cls: "flutter", x: W * 0.82, y: yOf(7), delay: -2.2 }
    ].map(d => ({ ...d, x: Math.round(d.x), y: Math.round(d.y) }));

    // nền vẽ bằng SVG: cỏ, mảng sáng, núi, hồ, đường mòn
    let svg = `<svg class="world-bg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
      <defs>
        <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5e7f73"/><stop offset="${(band(3).bot / H).toFixed(3)}" stop-color="#7f9a72"/>
          <stop offset="${(band(2).top / H + .02).toFixed(3)}" stop-color="#a8c27c"/><stop offset="${(band(2).bot / H).toFixed(3)}" stop-color="#9cc777"/>
          <stop offset="${(band(1).top / H + .03).toFixed(3)}" stop-color="#84d07a"/><stop offset="${(band(0).top / H).toFixed(3)}" stop-color="#7bcb6c"/>
          <stop offset="1" stop-color="#6fbf5f"/>
        </linearGradient>
        <radialGradient id="gLake" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#9be3ff"/><stop offset=".7" stop-color="#4fb3e6"/><stop offset="1" stop-color="#3a9bd0"/></radialGradient>
      </defs>
      <rect width="${W}" height="${H}" fill="url(#gGround)"/>`;
    for (let n = 0; n < 70; n++) svg += `<ellipse cx="${Math.round(rnd() * W)}" cy="${Math.round(rnd() * H)}" rx="${Math.round(30 + rnd() * 70)}" ry="${Math.round(14 + rnd() * 30)}" fill="#ffffff" opacity="${(0.04 + rnd() * 0.06).toFixed(2)}"/>`;
    const b2 = band(2);
    [[-30, b2.bot - 40, 170, 230], [W - 150, b2.bot - 120, 190, 260], [-20, b2.top + 260, 150, 200], [W - 120, b2.top + 160, 160, 210]].forEach(([x, y, w, h]) => {
      svg += `<polygon points="${x},${y} ${x + w / 2},${y - h} ${x + w},${y}" fill="#8d97a6"/><polygon points="${x + w / 2},${y - h} ${x + w * 0.36},${y - h * 0.68} ${x + w * 0.5},${y - h * 0.74} ${x + w * 0.64},${y - h * 0.66}" fill="#ffffff"/>`;
    });
    // hồ có mép bờ lượn sóng
    const lp = [];
    for (let k = 0; k < 14; k++) { const a = k / 14 * Math.PI * 2, j = .9 + rnd() * .16; lp.push({ x: Math.round(lake.cx + Math.cos(a) * lake.rx * j), y: Math.round(lake.cy + Math.sin(a) * lake.ry * j) }); }
    const lakeD = smoothPath([...lp, lp[0], lp[1], lp[2]]);
    svg += `<path d="${lakeD}" fill="#e8d9a8" stroke="#e8d9a8" stroke-width="34" stroke-linejoin="round"/>
      <path d="${lakeD}" fill="url(#gLake)" stroke="#bfe8f7" stroke-width="8" stroke-linejoin="round"/>
      <ellipse cx="${lake.cx - 30}" cy="${lake.cy - 60}" rx="${lake.rx * .45}" ry="18" fill="#ffffff" opacity=".25"/>`;
    const pathD = smoothPath(pts);
    const done = Math.min(S.done ? pts.length : S.unlocked + 1, pts.length);
    svg += `<path d="${pathD}" fill="none" stroke="#b98d55" stroke-width="50" stroke-linecap="round"/>
      <path d="${pathD}" fill="none" stroke="#efd9a4" stroke-width="40" stroke-linecap="round"/>
      <path d="${pathD}" fill="none" stroke="#fff6dc" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 22"/>`;
    if (done > 1) svg += `<path d="${smoothPath(pts.slice(0, done))}" fill="none" stroke="#ffc83d" stroke-width="9" stroke-linecap="round" stroke-dasharray="16 14"/>`;
    svg += `</svg>`;
    return { W, H, pts, cages, signs, deco, ambient, svg };
  }

  // Kéo thả bằng tay/chuột (có quán tính), con lăn chuột, và phím mũi tên
  function enablePan(view, world, W, H) {
    let x = 0, y = 0, vx = 0, vy = 0, raf = 0, drag = null, dragged = false;
    const clamp = () => {
      const vw = view.clientWidth, vh = view.clientHeight;
      x = W <= vw ? (vw - W) / 2 : Math.min(0, Math.max(vw - W, x));
      y = H <= vh ? (vh - H) / 2 : Math.min(0, Math.max(vh - H, y));
    };
    const apply = () => { clamp(); world.style.transform = `translate3d(${x}px,${y}px,0)`; };
    const glide = () => {
      vx *= 0.94; vy *= 0.94; x += vx; y += vy; apply();
      if (Math.abs(vx) + Math.abs(vy) > 0.3) raf = requestAnimationFrame(glide);
    };
    view.addEventListener("pointerdown", e => {
      cancelAnimationFrame(raf);
      drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, t: performance.now(), cap: false };
      dragged = false; vx = vy = 0;
    });
    view.addEventListener("pointermove", e => {
      if (!drag || e.pointerId !== drag.id) return;
      if (!drag.cap && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 8) {
        drag.cap = true; dragged = true; view.classList.add("grabbing");
        try { view.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (!drag.cap) return;
      const now = performance.now(), dt = Math.max(1, now - drag.t), dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
      x += dx; y += dy; apply();
      vx = dx / dt * 16; vy = dy / dt * 16;
      drag.lx = e.clientX; drag.ly = e.clientY; drag.t = now;
    });
    const end = e => {
      if (!drag || e.pointerId !== drag.id) return;
      const was = drag.cap, idle = performance.now() - drag.t; drag = null; view.classList.remove("grabbing");
      if (was && idle < 80) raf = requestAnimationFrame(glide);
      setTimeout(() => { dragged = false; }, 0);
    };
    view.addEventListener("pointerup", end);
    view.addEventListener("pointercancel", end);
    view.addEventListener("wheel", e => { e.preventDefault(); cancelAnimationFrame(raf); x -= e.deltaX; y -= e.deltaY; apply(); }, { passive: false });
    window.onresize = apply;
    window.onkeydown = e => {
      const k = { ArrowUp: [0, 80], ArrowDown: [0, -80], ArrowLeft: [80, 0], ArrowRight: [-80, 0] }[e.key];
      if (k && modal.hidden) { x += k[0]; y += k[1]; apply(); }
    };
    return {
      wasDrag: () => dragged,
      focus(px, py, smooth) {
        cancelAnimationFrame(raf);
        const tx = view.clientWidth / 2 - px, ty = view.clientHeight / 2 - py;
        if (!smooth) { x = tx; y = ty; apply(); return; }
        const sx = x, sy = y, t0 = performance.now();
        const step = now => {
          const k = Math.min(1, (now - t0) / 500), e = 1 - Math.pow(1 - k, 3);
          x = sx + (tx - sx) * e; y = sy + (ty - sy) * e; apply();
          if (k < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
      }
    };
  }

  function stageCard(i) {
    const st = STAGES[i], a = ANIMALS[st.rescue], freed = S.owned.includes(st.rescue), locked = i > S.unlocked;
    const counter = Object.keys(ELEM).find(k => ELEM[k].beats === st.el);
    const stars = "★".repeat(S.stars[i]) + `<i>${"★".repeat(3 - S.stars[i])}</i>`;
    showModal(`<div class="sc-head"><small>Vùng ${st.region + 1} · ${REGIONS[st.region]}</small><h2>Màn ${i + 1}${st.boss ? " · Trùm" : ""}</h2></div>
      <div class="sc-scene"><span class="foe-wrap"><span class="foe">${st.emoji}</span>${elBadge(st.el)}</span>${cageHTML(st.rescue, freed)}</div>
      <p>${st.enemy} ${freed ? `· đã cứu ${a.name} 💚` : `đang nhốt ${a.name}`}</p>
      <div class="stars">${stars}</div>
      <p class="note">Mẹo: ${st.enemy} hệ ${ELEM[st.el].icon} ${ELEM[st.el].name}, sợ hệ ${ELEM[counter].icon} ${ELEM[counter].name} (${ELEM[counter].name} ${ELEM[counter].verb} ${ELEM[st.el].name}).</p>
      ${locked ? `<p class="note"><b>🔒 Thắng màn ${i} để mở khoá.</b></p>` : `<button class="btn big green" data-play>⚔️ Vào trận</button>`}
      <button class="btn ghost" data-close>Đóng</button>`, m => {
      const pb = $("[data-play]", m); if (pb) pb.onclick = () => startBattle(i);
      $("[data-close]", m).onclick = hideModal;
    });
  }

  /* ================= ATTACK SOUNDS ================= */
  // Tiếng kêu khi tấn công, tổng hợp bằng Web Audio (không cần file âm thanh)
  let noiseBuf = null;
  function audio() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
      if (!noiseBuf) {
        noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
        const d = noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      return ac;
    } catch (e) { return null; }
  }
  function env(g, t, dur, peak, attack) {
    g.setValueAtTime(0.0001, t);
    g.exponentialRampToValueAtTime(peak, t + attack);
    g.setValueAtTime(peak, t + Math.max(attack, dur * 0.6));
    g.exponentialRampToValueAtTime(0.0001, t + dur);
  }
  function lfo(ctx, target, rate, depth, t, dur) {
    const l = ctx.createOscillator(), lg = ctx.createGain();
    l.frequency.value = rate; lg.gain.value = depth;
    l.connect(lg).connect(target); l.start(t); l.stop(t + dur + .05);
  }
  function chain(ctx, src, o, t, dur) {
    let node = src;
    if (o.lp || o.bp || o.hp) {
      const f = ctx.createBiquadFilter();
      f.type = o.lp ? "lowpass" : o.bp ? "bandpass" : "highpass";
      f.frequency.setValueAtTime(o.lp || o.bp || o.hp, t);
      if (o.f1) f.frequency.exponentialRampToValueAtTime(o.f1, t + dur);
      if (o.q) f.Q.value = o.q;
      node.connect(f); node = f;
    }
    if (o.am) {
      const g = ctx.createGain(); g.gain.value = .5;
      lfo(ctx, g.gain, o.am, .5, t, dur);
      node.connect(g); node = g;
    }
    return node;
  }
  function tone(f0, f1, dur, type, peak, t, o) {
    const ctx = ac; o = o || {};
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
    if (o.vib) lfo(ctx, osc.frequency, o.vib[0], o.vib[1], t, dur);
    env(g.gain, t, dur, peak, o.attack || .01);
    chain(ctx, osc, o, t, dur).connect(g).connect(ctx.destination);
    osc.start(t); osc.stop(t + dur + .05);
  }
  function noise(dur, peak, t, o) {
    const ctx = ac; o = o || {};
    const src = ctx.createBufferSource(), g = ctx.createGain();
    src.buffer = noiseBuf; src.loop = true;
    env(g.gain, t, dur, peak, o.attack || .01);
    chain(ctx, src, o, t, dur).connect(g).connect(ctx.destination);
    src.start(t); src.stop(t + dur + .05);
  }
  const SND = {
    bark: t => { [0, .26].forEach(d => { tone(560, 300, .15, "sawtooth", .16, t + d, { bp: 1000, q: 2 }); noise(.07, .1, t + d, { bp: 1500 }); }); },
    hiss: t => noise(.9, .12, t, { hp: 3500, attack: .12 }),
    croak: t => { [0, .3].forEach(d => tone(150, 115, .22, "square", .1, t + d, { am: 35, lp: 700 })); },
    buzz: t => tone(230, 250, .8, "sawtooth", .07, t, { vib: [20, 25], lp: 1600 }),
    whine: t => tone(700, 760, .8, "sawtooth", .04, t, { vib: [25, 40], lp: 3000 }),
    roar: t => { tone(160, 80, .9, "sawtooth", .15, t, { vib: [9, 30], lp: 700, attack: .05 }); noise(.9, .12, t, { lp: 900, f1: 250, attack: .08 }); },
    hoot: t => { tone(430, 380, .28, "sine", .2, t, { attack: .05 }); tone(430, 350, .45, "sine", .2, t + .38, { attack: .05 }); },
    squeak: t => { [0, .14, .28].forEach(d => tone(1800, 2700, .08, "sine", .1, t + d)); },
    chirp: t => { for (let i = 0; i < 6; i++) tone(2000 + i * 180, 3300, .07, "sine", .08, t + i * .09); },
    meow: t => { tone(450, 780, .22, "sawtooth", .09, t, { lp: 1800 }); tone(780, 420, .38, "sawtooth", .09, t + .22, { lp: 1800 }); },
    splash: t => noise(.55, .2, t, { lp: 3500, f1: 400 }),
    stomp: t => { tone(95, 38, .45, "sine", .45, t); noise(.3, .25, t, { lp: 700, f1: 100 }); },
    scratch: t => { [0, .12, .24].forEach(d => noise(.09, .16, t + d, { bp: 3200, f1: 1400, q: 1.5 })); },
    whoosh: t => noise(.45, .18, t, { bp: 400, f1: 2600, attack: .15, q: 1 }),
    chomp: t => { [0, .24].forEach(d => { noise(.06, .28, t + d, { lp: 2200, f1: 500 }); tone(210, 90, .08, "square", .1, t + d); }); },
    kick: t => { tone(170, 50, .16, "sine", .4, t); noise(.06, .14, t, { hp: 2000 }); },
    magic: t => [1047, 1319, 1568, 2093, 2637].forEach((f, i) => tone(f, f, .25, "triangle", .07, t + i * .07)),
    fire: t => noise(1, .2, t, { lp: 1300, f1: 300, attack: .1, am: 14 }),
    ghost: t => tone(300, 520, 1, "sine", .14, t, { vib: [6, 40], attack: .2 }),
    trumpet: t => tone(280, 620, .7, "sawtooth", .13, t, { vib: [7, 14], bp: 1200, attack: .05 }),
    growl: t => tone(115, 92, .7, "sawtooth", .14, t, { am: 26, lp: 520 }),
    grunt: t => { tone(180, 140, .15, "square", .1, t, { lp: 700 }); tone(230, 160, .18, "square", .1, t + .22, { lp: 700 }); },
    screech: t => tone(2600, 1700, .6, "sawtooth", .05, t, { bp: 2400, vib: [30, 90] }),
    howl: t => { tone(330, 700, .6, "sine", .15, t, { vib: [5, 12], attack: .2 }); tone(700, 420, .6, "sine", .15, t + .6, { vib: [5, 12] }); },
    click: t => { for (let i = 0; i < 6; i++) tone(3000, 3600, .03, "sine", .1, t + i * .07); },
    honk: t => { [0, .25].forEach(d => tone(360, 330, .2, "sawtooth", .1, t + d, { bp: 900 })); },
    chatter: t => { for (let i = 0; i < 4; i++) tone(700, 1150, .08, "square", .07, t + i * .12, { lp: 2000 }); }
  };
  // Tiếng thật lấy từ thư mục sounds/ (Mixkit, BigSoundBank, Wikimedia Commons); thiếu file thì dùng tiếng tổng hợp ở trên
  const SFX_FILES = new Set(["bark", "buzz", "catroar", "chatter", "chirp", "chomp", "croak", "devil", "dino", "dragon", "fart", "fire", "ghost", "growl", "grunt", "hiss", "hit", "honk", "hoot", "howl", "kick", "magic", "meow", "parrot", "roar", "scratch", "screech", "slide", "splash", "squeak", "squirt", "stomp", "trumpet", "whine", "whoosh"]);
  const sfxCache = {};
  function sfxEl(name) {
    let a = sfxCache[name];
    if (!a) { a = sfxCache[name] = new Audio(`sounds/${name}.mp3`); a.preload = "auto"; }
    return a;
  }
  function preloadSfx() { try { SFX_FILES.forEach(sfxEl); } catch (e) {} }
  function playFile(name) {
    try {
      const a = sfxEl(name), n = a.paused || a.ended ? a : a.cloneNode();
      n.volume = .85; n.currentTime = 0;
      const pr = n.play(); if (pr) pr.catch(() => {});
    } catch (e) {}
  }
  function moveSound(m) {
    if (!m || !m.snd) return;
    [].concat(m.snd).forEach((k, i) => setTimeout(() => {
      if (SFX_FILES.has(k)) playFile(k);
      else if (SND[k] && audio()) try { SND[k](ac.currentTime + .02); } catch (e) {}
    }, i * 380));
  }

  /* ================= FIGHT SCENE ================= */
  // Màn đánh nhau phóng to sau mỗi câu trả lời. Mỗi kiểu đòn là một hàm hoạt họa riêng.
  const fightBox = $("#fight");
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const reduceMotion = (() => { try { return matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } })();
  const an = (el, kf, opt) => el.animate(kf, Object.assign({ duration: 300, fill: "forwards", easing: "ease-in-out" }, opt)).finished;
  const T = (x, y, extra) => `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) ${extra || ""}`;

  function playFight(o) {
    if (S.fightFx === false || reduceMotion) { moveSound(o.move); return Promise.resolve(); }
    return new Promise(resolve => {
      fightBox.innerHTML = `<div class="f-title">${o.title}</div>
        <div class="f-stage" id="fStage">
          <div class="f-ground"></div>
          <div class="f-actor f-l" id="fL"><span class="f-face flip">${o.left.emoji}</span>${elBadge(o.left.el)}</div>
          <div class="f-vs" id="fVs">VS</div>
          <div class="f-actor f-r" id="fR"><span class="f-face">${o.right.emoji}</span>${elBadge(o.right.el)}</div>
        </div>
        <div class="f-result" id="fRes"></div>
        <div class="f-skip">Chạm để bỏ qua ▶</div>`;
      fightBox.hidden = false;
      let done = false;
      const finish = () => { if (done) return; done = true; fightBox.hidden = true; fightBox.innerHTML = ""; resolve(); };
      fightBox.onclick = finish;
      runFight(o).catch(() => {}).then(() => wait(1000)).then(finish);
    });
  }

  async function runFight(o) {
    const st = $("#fStage"), L = $("#fL"), R = $("#fR");
    const A = o.attLeft ? L : R, D = o.attLeft ? R : L, dir = o.attLeft ? 1 : -1;
    const box = st.getBoundingClientRect();
    const ctr = el => { const r = el.getBoundingClientRect(); return { x: r.left - box.left + r.width / 2, y: r.top - box.top + r.height / 2 }; };
    const a = ctr(A), d = ctr(D);
    const c = { st, A, D, dir, a, d, dist: Math.abs(d.x - a.x), o, m: o.move };
    c.spawn = (cls, html, x, y) => {
      const e = document.createElement("div");
      e.className = "fx " + cls; e.innerHTML = html || "";
      e.style.left = x + "px"; e.style.top = y + "px";
      st.appendChild(e); return e;
    };
    c.pop = (html, x, y, cls, ms) => {
      const e = c.spawn(cls || "spark", html, x, y);
      an(e, [{ transform: T(0, 0, "scale(.3)"), opacity: 1 }, { transform: T(0, -16, "scale(1.6)"), opacity: 0 }], { duration: ms || 420 }).then(() => e.remove());
    };
    c.hit = big => {
      playFile("hit");
      if (o.shield) {
        const s = c.spawn("shield", "🛡️", d.x, d.y);
        an(s, [{ transform: T(0, 0, "scale(.5)"), opacity: 0 }, { transform: T(0, 0, "scale(1.2)"), opacity: .95 }, { transform: T(0, 0, "scale(1.1)"), opacity: 0 }], { duration: 480 }).then(() => s.remove());
        return;
      }
      an(D, [{ transform: "none", filter: "brightness(1)" },
        { transform: `translateX(${dir * (big ? 26 : 12)}px) rotate(${dir * (big ? 14 : 6)}deg)`, filter: "brightness(2.4)" },
        { transform: `translateX(${-dir * 6}px)`, filter: "brightness(1)" }, { transform: "none", filter: "none" }], { duration: 360 });
      if (big) c.pop("💥", d.x + rand(-20, 20), d.y + rand(-20, 20), "boom", 480);
    };

    // vào trận: hai bên lao vào sân, chữ VS đập xuống
    an(L, [{ transform: "translateX(-130%) scale(.6)" }, { transform: "none" }], { duration: 400, easing: "cubic-bezier(.3,1.5,.5,1)" });
    an(R, [{ transform: "translateX(130%) scale(.6)" }, { transform: "none" }], { duration: 400, easing: "cubic-bezier(.3,1.5,.5,1)" });
    await an($("#fVs"), [{ transform: "scale(3)", opacity: 0 }, { transform: "scale(1)", opacity: 1, offset: .45 }, { transform: "scale(1)", opacity: 0 }], { duration: 750 });

    moveSound(c.m);
    if (c.m.say) c.pop(c.m.say, a.x, a.y - 95, "cry", 1300);
    await (ATTACKS[c.m.kind] || ATTACKS.bite)(c);

    if (o.dmgText && !o.shield) c.pop(o.dmgText, d.x, d.y - 70, "dmgnum " + (o.resultCls || ""), 900);
    if (o.heal) {
      an(R, [{ filter: "none" }, { filter: "drop-shadow(0 0 18px #4cff8a) brightness(1.2)" }, { filter: "none" }], { duration: 800 });
      c.pop(`+${o.heal}`, ctr(R).x, ctr(R).y - 70, "dmgnum heal", 900);
    }
    const res = $("#fRes");
    res.innerHTML = o.result; res.className = "f-result " + (o.resultCls || "");
    await an(res, [{ transform: "scale(.4)", opacity: 0 }, { transform: "scale(1.15)", opacity: 1, offset: .6 }, { transform: "scale(1)", opacity: 1 }], { duration: 380 });
  }

  const ATTACKS = {
    // Ong, Muỗi, Bọ Cạp: bay tới, chĩa đuôi chích 3 phát
    async sting(c) {
      const { A, dir, dist, d } = c, dx = dir * (dist - 85);
      await an(A, [{ transform: "none" }, { transform: `translate(${dx * .5}px,-50px) rotate(${dir * -10}deg)` }, { transform: `translate(${dx}px,-14px)` }], { duration: 480 });
      for (let k = 0; k < 3; k++) {
        await an(A, [{ transform: `translate(${dx}px,-14px)` }, { transform: `translate(${dx + dir * 34}px,4px) rotate(${dir * 28}deg)` }, { transform: `translate(${dx}px,-14px)` }], { duration: 190, easing: "ease-out" });
        c.pop("✦", d.x - dir * 30 + rand(-8, 8), d.y + rand(-10, 10));
        c.hit(k === 2);
      }
      await an(A, [{ transform: `translate(${dx}px,-14px)` }, { transform: "none" }], { duration: 320 });
    },
    // Rùa cắn cổ, Sư Tử, Cá Sấu...: lùi lấy đà, vồ tới, hàm răng đớp 2 lần
    async bite(c) {
      const { A, dir, dist, d } = c, dx = dir * (dist - 70);
      await an(A, [{ transform: "none" }, { transform: `translateX(${-dir * 24}px) scale(.92)` }], { duration: 200 });
      await an(A, [{ transform: `translateX(${-dir * 24}px) scale(.92)` }, { transform: `translateX(${dx}px) scale(1.18)` }], { duration: 200, easing: "ease-in" });
      const j = c.spawn("jaws", `<i class="jt"></i><i class="jb"></i>`, d.x, d.y - 10);
      for (let k = 0; k < 2; k++) {
        await Promise.all([
          an($(".jt", j), [{ transform: "translateY(-60px)" }, { transform: "translateY(0)" }], { duration: 150, easing: "ease-in" }),
          an($(".jb", j), [{ transform: "translateY(60px)" }, { transform: "translateY(0)" }], { duration: 150, easing: "ease-in" })]);
        c.hit(k === 1);
        await wait(140);
      }
      j.remove();
      await an(A, [{ transform: `translateX(${dx}px) scale(1.18)` }, { transform: "none" }], { duration: 300 });
    },
    // Sâu Róm bắn lông, Nhím bắn gai, Sóc ném hạt, Khỉ ném chuối...
    async shoot(c) {
      const { A, dir, a, d, m } = c, n = m.count || 8;
      await an(A, [{ transform: "none" }, { transform: `translateX(${-dir * 16}px) scale(1.12,.9)` }], { duration: 220 });
      an(A, [{ transform: `translateX(${-dir * 16}px) scale(1.12,.9)` }, { transform: "none" }], { duration: 300, delay: 120 });
      const ps = [];
      for (let i = 0; i < n; i++) ps.push(wait(i * 80).then(() => {
        const sx = a.x + dir * 40, sy = a.y + rand(-24, 12), ex = d.x - sx + rand(-14, 14), ey = d.y - sy + rand(-30, 30);
        const ang = Math.atan2(ey, ex) * 180 / Math.PI;
        const e = c.spawn("proj", m.proj || `<i class="needle"></i>`, sx, sy);
        const r0 = m.proj ? "rotate(0deg)" : `rotate(${ang}deg)`, r1 = m.proj ? "rotate(540deg)" : `rotate(${ang}deg)`;
        return an(e, [{ transform: T(0, 0, r0) }, { transform: T(ex, ey, r1) }], { duration: 340, easing: "linear" })
          .then(() => { e.remove(); c.hit(i === n - 1); });
      }));
      await Promise.all(ps);
    },
    // Rắn phun độc, Rồng phun lửa, Cá Heo phun nước: ngửa ra sau rồi phun cục bay vòng cung
    async spit(c) {
      const { A, D, dir, a, d, m, o } = c, n = m.count || 5;
      await an(A, [{ transform: "none" }, { transform: `translateX(${-dir * 20}px) rotate(${-dir * 12}deg) scale(1.1)` }], { duration: 260 });
      an(A, [{ transform: `translateX(${-dir * 20}px) rotate(${-dir * 12}deg) scale(1.1)` }, { transform: `translateX(${dir * 12}px)` }, { transform: "none" }], { duration: 420 });
      const ps = [];
      for (let i = 0; i < n; i++) ps.push(wait(i * 90).then(() => {
        const sx = a.x + dir * 45, sy = a.y - 10, ex = d.x - sx + rand(-16, 16), ey = d.y - sy + rand(-20, 20);
        const e = c.spawn("blob", m.proj || "", sx, sy);
        if (!m.proj) e.style.background = m.color;
        return an(e, [{ transform: T(0, 0, "scale(.6)") }, { transform: T(ex / 2, ey / 2 - 70, "scale(1.2)") }, { transform: T(ex, ey, "scale(1)") }], { duration: 420, easing: "linear" })
          .then(() => { e.remove(); c.hit(i === n - 1); });
      }));
      await Promise.all(ps);
      if (!o.shield && m.color) await an(D, [{ filter: "none" }, { filter: `drop-shadow(0 0 14px ${m.color}) saturate(1.8)` }, { filter: "none" }], { duration: 650 });
    },
    // Lợn Rừng, Hươu, Bọ Rùa, Chim Cánh Cụt: lùi lấy đà rồi lao vào húc văng
    async ram(c) {
      const { A, D, dir, dist, a } = c, dx = dir * (dist - 50);
      await an(A, [{ transform: "none" }, { transform: `translateX(${-dir * 40}px) rotate(${-dir * 8}deg)` }], { duration: 280 });
      c.pop("💨", a.x - dir * 50, a.y + 30, "puff", 500);
      await an(A, [{ transform: `translateX(${-dir * 40}px) rotate(${-dir * 8}deg)` }, { transform: `translateX(${dx}px) rotate(${dir * 6}deg)` }], { duration: 180, easing: "ease-in" });
      c.hit(true);
      if (!c.o.shield) an(D, [{ transform: "none" }, { transform: `translate(${dir * 70}px,-30px) rotate(${dir * 30}deg)` }, { transform: "none" }], { duration: 620, easing: "ease-out" });
      await an(A, [{ transform: `translateX(${dx}px)` }, { transform: "none" }], { duration: 420 });
    },
    // Voi, Khủng Long: nhảy lên cao rồi giẫm xuống, cả sân rung
    async stomp(c) {
      const { A, D, dir, dist, st } = c, dx = dir * (dist - 20);
      await an(A, [{ transform: "none" }, { transform: `translate(${dx * .5}px,-150px) scale(1.15)` }, { transform: `translate(${dx}px,-170px) scale(1.2)` }], { duration: 520, easing: "ease-out" });
      await an(A, [{ transform: `translate(${dx}px,-170px) scale(1.2)` }, { transform: `translate(${dx}px,-30px) scale(1.25,.9)` }], { duration: 160, easing: "ease-in" });
      an(st, [{ transform: "none" }, { transform: "translateY(12px)" }, { transform: "translateY(-6px)" }, { transform: "none" }], { duration: 320 });
      c.hit(true);
      if (!c.o.shield) an(D, [{ transform: "none" }, { transform: "scale(1.35,.45)" }, { transform: "none" }], { duration: 650 });
      await an(A, [{ transform: `translate(${dx}px,-30px)` }, { transform: `translate(${dx * .5}px,-90px)` }, { transform: "none" }], { duration: 520 });
    },
    // Mèo, Cáo, Gấu, Đại Bàng: lao tới cào 3 vệt
    async claw(c) {
      const { A, dir, dist, d } = c, dx = dir * (dist - 90);
      await an(A, [{ transform: "none" }, { transform: `translate(${dx}px,-20px) rotate(${dir * 10}deg)` }], { duration: 280, easing: "ease-in" });
      for (let k = 0; k < 3; k++) {
        const s = c.spawn("slash", "", d.x + (k - 1) * 22, d.y + (k - 1) * 8);
        an(s, [{ transform: T(0, 0, `rotate(${dir * -40}deg) scaleX(0)`), opacity: 1 }, { transform: T(0, 0, `rotate(${dir * -40}deg) scaleX(1)`), opacity: 1, offset: .5 }, { transform: T(0, 0, `rotate(${dir * -40}deg) scaleX(1)`), opacity: 0 }], { duration: 380 }).then(() => s.remove());
        c.hit(k === 2); await wait(110);
      }
      await an(A, [{ transform: `translate(${dx}px,-20px)` }, { transform: "none" }], { duration: 320 });
    },
    // Cú hú, Vẹt hát, Ma hù: hét to, sóng âm lan tới
    async wave(c) {
      const { A, dir, a, d, m } = c;
      an(A, [{ transform: "none" }, { transform: "scale(1.25)" }, { transform: "scale(1.15)" }, { transform: "none" }], { duration: 900 });
      const ps = [];
      for (let i = 0; i < 3; i++) ps.push(wait(i * 200).then(() => {
        const r = c.spawn("ring " + (dir > 0 ? "r" : "l") + (m.proj ? " note" : ""), m.proj || "", a.x + dir * 40, a.y);
        return an(r, [{ transform: T(0, 0, "scale(.3)"), opacity: 1 }, { transform: T(d.x - a.x - dir * 40, 0, "scale(1.6)"), opacity: .25 }], { duration: 540, easing: "ease-out" })
          .then(() => { r.remove(); c.hit(i === 2); });
      }));
      await Promise.all(ps);
    },
    // Thỏ: quay lưng lại rồi đá hậu, đối thủ bay vòng
    async kick(c) {
      const { A, D, dir, dist } = c, dx = dir * (dist - 60);
      await an(A, [{ transform: "none" }, { transform: `translateX(${dx}px) scaleX(-1)` }], { duration: 360 });
      await an(A, [{ transform: `translateX(${dx}px) scaleX(-1)` }, { transform: `translateX(${dx + dir * 22}px) scaleX(-1) rotate(${dir * 30}deg)` }, { transform: `translateX(${dx}px) scaleX(-1)` }], { duration: 220 });
      c.hit(true);
      if (!c.o.shield) an(D, [{ transform: "none" }, { transform: `translate(${dir * 80}px,-70px) rotate(${dir * 200}deg)` }, { transform: "none" }], { duration: 720, easing: "ease-out" });
      await an(A, [{ transform: `translateX(${dx}px) scaleX(-1)` }, { transform: "none" }], { duration: 380 });
    },
    // Ếch: phóng lưỡi dài quất trúng rồi kéo đối thủ lại gần
    async tongue(c) {
      const { A, D, dir, a, dist } = c, len = dist - 50;
      await an(A, [{ transform: "none" }, { transform: `translateX(${-dir * 10}px) scale(1.1)` }], { duration: 180 });
      const t = c.spawn("tongue " + (dir > 0 ? "r" : "l"), "", 0, a.y + 8);
      t.style.width = len + "px"; t.style.left = (dir > 0 ? a.x + 25 : a.x - 25 - len) + "px";
      await an(t, [{ transform: "translateY(-50%) scaleX(0)" }, { transform: "translateY(-50%) scaleX(1)" }], { duration: 200, easing: "ease-out" });
      c.hit(true);
      if (!c.o.shield) an(D, [{ transform: "none" }, { transform: `translateX(${-dir * 40}px)` }, { transform: "none" }], { duration: 420 });
      await an(t, [{ transform: "translateY(-50%) scaleX(1)" }, { transform: "translateY(-50%) scaleX(0)" }], { duration: 220 });
      t.remove();
      an(A, [{ transform: `translateX(${-dir * 10}px) scale(1.1)` }, { transform: "none" }], { duration: 200 });
    },
    // Kỳ Lân: bắn tia cầu vồng
    async beam(c) {
      const { A, dir, a, d, dist } = c, len = dist - 60;
      await an(A, [{ transform: "none" }, { transform: "translateY(-16px) scale(1.15)" }], { duration: 260 });
      const b = c.spawn("beam " + (dir > 0 ? "r" : "l"), "", 0, a.y);
      b.style.width = len + "px"; b.style.left = (dir > 0 ? a.x + 30 : a.x - 30 - len) + "px";
      await an(b, [{ transform: "translateY(-50%) scaleX(0)" }, { transform: "translateY(-50%) scaleX(1)" }], { duration: 260 });
      for (let k = 0; k < 3; k++) { c.pop("✨", d.x + rand(-40, 40), d.y + rand(-40, 40)); c.hit(k === 2); await wait(150); }
      await an(b, [{ opacity: 1 }, { opacity: 0 }], { duration: 250 });
      b.remove();
      an(A, [{ transform: "translateY(-16px) scale(1.15)" }, { transform: "none" }], { duration: 260 });
    },
    // Gấu Trúc: ôm chặt bóp 2 lần
    async squeeze(c) {
      const { A, D, dir, dist } = c, dx = dir * (dist - 40);
      await an(A, [{ transform: "none" }, { transform: `translateX(${dx}px) scale(1.2)` }], { duration: 320 });
      for (let k = 0; k < 2; k++) {
        an(A, [{ transform: `translateX(${dx}px) scale(1.2)` }, { transform: `translateX(${dx}px) scale(1.35,1.05)` }, { transform: `translateX(${dx}px) scale(1.2)` }], { duration: 260 });
        if (!c.o.shield) an(D, [{ transform: "none" }, { transform: "scale(.7,1.15)" }, { transform: "none" }], { duration: 260 });
        c.hit(k === 1); await wait(320);
      }
      await an(A, [{ transform: `translateX(${dx}px) scale(1.2)` }, { transform: "none" }], { duration: 320 });
    }
  };

  /* ================= BATTLE ================= */
  let B = null;
  const MU_LABEL = { strong: `Mạnh ×${DMG.strong}`, normal: `Thường ×${DMG.normal}`, weak: `Yếu ×${DMG.weak}`, plain: `Đánh ×${DMG.plain}` };
  function firstPet() {
    const ready = S.owned.filter(id => !isHungry(id));
    return ready.length ? ready[ready.length - 1] : null;
  }
  function startBattle(i) {
    clearInterval(ticker); window.onresize = window.onkeydown = null;
    const st = STAGES[i], pet = firstPet();
    if (!pet) return allHungry(false);
    B = { i, hp: st.hp, max: st.hp, hearts: MAX_HEARTS, shield: false, poison: 0, pet, busy: false, lost: 0, p: null };
    app.scrollTop = 0; hideModal();
    const caged = !S.owned.includes(st.rescue);
    app.innerHTML = `<div class="screen">
      <div class="bar"><button class="icon-btn" data-back aria-label="Về bản đồ">←</button>
        <div class="grow"><h2>Màn ${i + 1}</h2></div>
        <button class="icon-btn" data-legend aria-label="Bảng khắc chế">☯️</button>
        <div class="hearts" id="hearts"></div></div>
      <div class="arena" id="arena">
        <div class="side" id="meSide"><span class="shield-badge" id="shield" hidden>🛡️</span>
          <div class="me-row"><span class="hero-sprite">${heroEmoji()}</span><span class="pet-sprite" id="petSprite"></span></div>
          <div class="hp-num" id="petName"></div></div>
        <div class="side" id="foeSide"><div class="bubble" id="bubble">${st.taunt}</div>
          <div class="foe-row"><span class="foe-wrap"><span class="enemy-sprite" id="enemySprite">${st.emoji}</span>${elBadge(st.el)}</span>
            ${caged ? cageHTML(st.rescue, false, "sm") : ""}</div>
          <div class="hpbar"><i id="hpFill"></i></div><div class="hp-num" id="hpNum"></div></div>
      </div>
      <div class="panel" id="panel"></div>
      <div class="tray-label">Chọn bạn thú ra trận (kéo sang để xem thêm 👉):</div>
      <div class="tray" id="tray"></div></div>`;
    $("[data-back]").onclick = () => go("map");
    $("[data-legend]").onclick = showLegend;
    dragScroll($("#tray")); preloadSfx();
    setTimeout(() => { const b = $("#bubble"); if (b) b.hidden = true; }, 3500);
    hud(); renderTray(); say(st.taunt); newProblem(true);
  }
  function hud() {
    const st = STAGES[B.i], a = ANIMALS[B.pet];
    $("#hearts").textContent = "❤️".repeat(B.hearts) + "🤍".repeat(MAX_HEARTS - B.hearts);
    $("#hpFill").style.width = Math.max(0, (B.hp / B.max) * 100) + "%";
    $("#hpNum").textContent = `${st.enemy} · ${Math.max(0, B.hp)}/${B.max}`;
    $("#petSprite").textContent = a.emoji;
    $("#petName").textContent = `${a.name}${a.el ? " " + ELEM[a.el].icon : ""} · ${MU_LABEL[matchup(a.el, st.el)]}`;
    $("#shield").hidden = !B.shield;
  }
  function renderTray() {
    const tray = $("#tray"), foeEl = STAGES[B.i].el;
    tray.innerHTML = S.owned.map(id => {
      const a = ANIMALS[id], hungry = isHungry(id), mu = matchup(a.el, foeEl);
      return `<button class="pet-card${id === B.pet ? " on" : ""}${hungry ? " hungry" : ""}" data-pet="${id}">
        ${elBadge(a.el)}<span class="em"><span class="pet-body" style="${bodyStyle(id)}">${a.emoji}</span></span><b>${a.name}</b>
        <span class="mu ${mu}">${MU_LABEL[mu]}</span><span class="en">${hungry ? "Đói rồi" : bolts(id)}</span></button>`;
    }).join("");
    tray.querySelectorAll("[data-pet]").forEach(b => b.onclick = () => {
      const id = b.dataset.pet;
      if (B.busy || id === B.pet) return;
      if (isHungry(id)) { toast(`${ANIMALS[id].name} đói rồi! Về 🏕️ Trại cho ăn nhé.`); return; }
      B.pet = id; sfx("ok"); hud(); renderTray(); newProblem();
      const a = ANIMALS[id], st = STAGES[B.i], mu = matchup(a.el, st.el);
      if (mu === "strong") toast(`${ELEM[a.el].icon} ${ELEM[a.el].name} ${ELEM[a.el].verb} ${ELEM[st.el].icon} ${ELEM[st.el].name}: đánh gấp đôi ×${DMG.strong}!`, 3000);
      if (mu === "weak") toast(`Ôi! ${ELEM[st.el].icon} ${ELEM[st.el].name} ${ELEM[st.el].verb} ${ELEM[a.el].icon} ${ELEM[a.el].name}: chỉ đánh được ${DMG.weak} thôi.`, 3000);
    });
    const on = $(".pet-card.on", tray);
    if (on && (on.offsetLeft < tray.scrollLeft || on.offsetLeft + on.clientWidth > tray.scrollLeft + tray.clientWidth))
      tray.scrollTo({ left: on.offsetLeft - tray.clientWidth / 2 + on.clientWidth / 2, behavior: "smooth" });
  }
  // Kéo lướt ngang bằng chuột như vuốt tay (cảm ứng dùng cuộn gốc của máy), có trôi theo quán tính
  function dragScroll(el) {
    let d = null, v = 0, raf = 0, moved = false;
    el.addEventListener("pointerdown", e => {
      if (e.pointerType !== "mouse") return;
      cancelAnimationFrame(raf);
      d = { x: e.clientX, sl: el.scrollLeft, lx: e.clientX, t: performance.now(), id: e.pointerId }; moved = false; v = 0;
    });
    el.addEventListener("pointermove", e => {
      if (!d || e.pointerId !== d.id) return;
      if (!moved && Math.abs(e.clientX - d.x) > 6) { moved = true; el.classList.add("grabbing"); try { el.setPointerCapture(e.pointerId); } catch (err) {} }
      if (!moved) return;
      const now = performance.now();
      v = (e.clientX - d.lx) / Math.max(1, now - d.t) * 16;
      d.lx = e.clientX; d.t = now;
      el.scrollLeft = d.sl - (e.clientX - d.x);
    });
    const end = () => {
      if (!d) return;
      const idle = performance.now() - d.t; d = null; el.classList.remove("grabbing");
      if (moved && idle < 80) {
        const glide = () => { v *= .93; el.scrollLeft -= v; if (Math.abs(v) > .4) raf = requestAnimationFrame(glide); };
        raf = requestAnimationFrame(glide);
      }
    };
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
    el.addEventListener("click", e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
    el.addEventListener("wheel", e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); el.scrollLeft += e.deltaY; } }, { passive: false });
  }
  function newProblem(queueSpeech) {
    const p = makeProblem(ANIMALS[B.pet].type, diff(B.pet));
    B.p = p; B.busy = false;
    const panel = $("#panel");
    panel.innerHTML = problemHTML(p);
    bindProblem(panel, p, onBattleAnswer);
    say(p.speech, queueSpeech);
  }
  function onBattleAnswer(btn, c) {
    if (B.busy) return; B.busy = true;
    const p = B.p, ok = c.v === p.answer, panel = $("#panel");
    record(p.type, ok); markChoices(panel, btn, ok, p);
    if (ok) {
      const id = B.pet, a = ANIMALS[id], ps = S.pets[id], lvBefore = level(id), st = STAGES[B.i];
      const mu = matchup(a.el, st.el), dmg = DMG[mu] + B.poison;
      ps.xp++; ps.atk = Math.max(0, ps.atk - 1);
      if (a.fx === "shield") B.shield = true;
      if (a.fx === "poison") B.poison = Math.min(10, B.poison + 2);
      const healed = a.fx === "heal" && B.hearts < MAX_HEARTS; if (healed) B.hearts++;
      persist(); sfx("ok");
      say(mu === "strong" ? "Khắc chế! " + pick(PRAISE) : pick(PRAISE));
      wait(350).then(() => playFight({ attLeft: true, left: a, right: st, move: a.move,
        title: `${a.emoji} ${a.name} dùng <b>${a.move.name}</b>!`, resultCls: mu, dmgText: `-${dmg}`,
        result: mu === "strong" ? `KHẮC CHẾ! −${dmg}` : mu === "weak" ? `Bị khắc... chỉ −${dmg}` : `Trúng đòn! −${dmg}` })).then(() => {
      anim($("#petSprite"), "lunge");
      setTimeout(() => {
        B.hp -= dmg; anim($("#enemySprite"), "hit");
        floatText($("#foeSide"), mu === "strong" ? `💥 -${dmg}` : `-${dmg}`, false, mu);
        if (mu === "strong") floatText($("#meSide"), "Khắc chế!", true);
        else if (mu === "weak") floatText($("#meSide"), "Bị khắc...", false);
        else if (healed) floatText($("#meSide"), "+❤️", true);
        else if (a.fx === "shield") floatText($("#meSide"), "🛡️", true);
        else if (a.fx === "poison") floatText($("#meSide"), "Gai +2", true);
        hud();
      }, 250);
      if (level(id) > lvBefore) setTimeout(() => toast(`${a.name} lên cấp ${level(id)}! 🎉`), 400);
      setTimeout(() => {
        if (B.hp <= 0) return win();
        if (isHungry(id)) {
          const nx = firstPet();
          if (!nx) return allHungry(true);
          toast(`${a.name} đói rồi, ${ANIMALS[nx].name} ra trận!`); B.pet = nx; hud();
        }
        renderTray(); newProblem();
      }, 1200);
      });
    } else {
      sfx("bad");
      let shieldMsg = "";
      anim($("#enemySprite"), "lunge-left");
      // Sai thì quái hồi đúng số máu mà câu đúng lẽ ra đã đánh mất
      const a = ANIMALS[B.pet], st = STAGES[B.i], mu = matchup(a.el, st.el), back = DMG[mu] + B.poison;
      const shielded = B.shield, willHeal = shielded ? 0 : Math.min(back, B.max - B.hp);
      wait(350).then(() => playFight({ attLeft: false, left: a, right: st, move: st.move,
        title: `${st.emoji} ${st.enemy} dùng <b>${st.move.name}</b>!`, shield: shielded, heal: willHeal,
        resultCls: shielded ? "" : "bad",
        result: shielded ? "🛡️ Đỡ được rồi!" : `Mất 1 ❤️${willHeal ? ` · ${st.enemy} hồi ${willHeal} máu` : ""}` })).then(() => {
        if (B.shield) { B.shield = false; shieldMsg = "🛡️ Có khiên đỡ đòn: quái không hồi máu, bé không mất tim!"; }
        else {
          B.hearts--; B.lost++; anim($("#arena"), "shake");
          const healed = Math.min(back, B.max - B.hp);
          B.hp += healed;
          if (healed > 0) floatText($("#foeSide"), `+${healed}`, true);
          shieldMsg = `${st.enemy} hồi lại ${healed} máu.`;
        }
        hud(); persist();
        panel.innerHTML = hintHTML(p, shieldMsg);
        say("Chưa đúng rồi. " + p.explain);
        $("[data-next]", panel).onclick = () => { if (B.hearts <= 0) lose(); else newProblem(); };
      });
    }
  }
  function win() {
    const st = STAGES[B.i], last = B.i === STAGES.length - 1;
    const stars = B.lost === 0 ? 3 : B.lost <= 2 ? 2 : 1;
    S.stars[B.i] = Math.max(S.stars[B.i], stars);
    if (!last) S.unlocked = Math.max(S.unlocked, B.i + 1);
    let rescued = null;
    if (!S.owned.includes(st.rescue)) {
      rescued = st.rescue; S.owned.push(rescued); S.pets[rescued] = { xp: 0, atk: ATK_MAX, fedAt: 0 };
    }
    const finale = last && !S.done; if (last) S.done = true;
    persist(); sfx("win");
    const starHTML = `<div class="stars">${"★".repeat(stars)}<i>${"★".repeat(3 - stars)}</i></div>`;
    let body;
    if (rescued) {
      const a = ANIMALS[rescued];
      body = `<div class="cage-pop">${cageHTML(rescued, false)}</div><h2>${finale ? "Rồng Lửa thua rồi! 🏆" : "Giải cứu thành công!"}</h2>${starHTML}
        <p>${heroName()} đã cứu được ${a.name}!</p>
        <p class="note">Hệ ${a.el ? ELEM[a.el].icon + " " + ELEM[a.el].name : "thường"} · Bài: <b>${TOPIC[a.type].toLowerCase()}</b> · ${a.skill}: ${a.desc}.</p>`;
      say(finale ? `Tuyệt vời! ${heroName()} đã đánh bại Rồng Lửa và cứu được ${a.name}!` : `Giải cứu thành công! ${a.name} đã về đội của ${heroName()}!`);
    } else {
      body = `<div class="big-em">${st.emoji}💨</div><h2>Thắng rồi!</h2>${starHTML}<p>${st.enemy} đã bỏ chạy!</p>`;
      say("Thắng rồi!");
    }
    showModal(body + `<button class="btn big green" data-map>Về bản đồ</button>`, m => {
      // song sắt bật lên sau một nhịp
      const c = $(".cage-pop .cage-box", m);
      if (c) setTimeout(() => { c.classList.add("open"); const l = $(".lock", c); if (l) l.remove(); }, 700);
      $("[data-map]", m).onclick = () => go("map");
    });
  }
  // Không còn bạn thú nào có lượt tấn công
  function allHungry(midBattle) {
    say("Các bạn thú đói hết rồi. Về trại cho ăn nhé!");
    showModal(`<div class="big-em">😴</div><h2>Các bạn thú đói hết rồi!</h2>
      <p>${midBattle ? "Bạn thú nào cũng hết lượt tấn công." : "Chưa bạn thú nào có lượt tấn công."}</p>
      <p class="note">Về 🏕️ Trại, giải bài để cho bạn thú ăn. Mỗi câu đúng được thêm 1 lượt tấn công.</p>
      <button class="btn big green" data-camp>🏕️ Về trại cho ăn</button><button class="btn ghost" data-map>Về bản đồ</button>`, m => {
      $("[data-camp]", m).onclick = () => go("camp");
      $("[data-map]", m).onclick = () => go("map");
    });
  }
  function lose() {
    say("Hết tim rồi. Thử lại nhé!");
    showModal(`<div class="big-em">😵</div><h2>Hết tim rồi!</h2><p>Không sao cả, mình thử lại nhé!</p>
      <p class="note">Mẹo: chọn bạn thú có nhãn <b>Mạnh ×${DMG.strong}</b> để đánh nhanh hơn.</p>
      <button class="btn big green" data-retry>Chơi lại</button><button class="btn wood" data-camp>🏕️ Về trại cho thú ăn</button>`, m => {
      $("[data-retry]", m).onclick = () => startBattle(B.i);
      $("[data-camp]", m).onclick = () => go("camp");
    });
  }

  go("title");
})();
</script>
